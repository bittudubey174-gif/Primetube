<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeTube Global</title>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; margin: 0; }
        .video-card { border: 1px solid #333; border-radius: 10px; padding: 10px; background: #111; }
        .global-menu button { background: #222; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .global-menu button:hover { background: #ff0000; }
    </style>
</head>
<body>

    <!-- 1. ग्लोबल बटन्स (यह वीडियो के ऊपर दिखेंगे) -->
    <div class="global-menu" style="display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: #000; border-bottom: 1px solid #333;">
        <button onclick="loadPrimeTube('IN')">🇮🇳 India</button>
        <button onclick="loadPrimeTube('KR')">🇰🇷 Korea</button>
        <button onclick="loadPrimeTube('US')">🇺🇸 USA</button>
        <button onclick="loadPrimeTube('BR')">🇧🇷 Brazil</button>
    </div>

    <!-- 2. वीडियो डिस्प्ले एरिया -->
    <div id="video-display-area" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; padding: 15px;">
        <p style="text-align:center;">Loading PrimeTube...</p>
    </div>

    <!-- 3. मास्टर जावास्क्रिप्ट (Script टैग के अंदर) -->
    <script>
        const API_KEY = "AIzaSyBpeELAxOw_KMG8E6b7HlLG2F2_Clj1O3g"; 

        async function loadPrimeTube(region = 'IN') {
            const videoContainer = document.getElementById('video-display-area');
            videoContainer.innerHTML = "<p style='text-align:center;'>Loading Global Hits...</p>";

            const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=${region}&maxResults=12&key=${API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.items) {
                    renderVideos(data.items);
                } else {
                    videoContainer.innerHTML = "<p style='color:red;'>API Error: Check Key</p>";
                }
            } catch (error) {
                console.error("Network Error:", error);
            }
        }

        function renderVideos(videos) {
            const videoContainer = document.getElementById('video-display-area');
            videoContainer.innerHTML = ""; 

            videos.forEach(video => {
                const videoId = video.id;
                const title = video.snippet.title;
                const thumb = video.snippet.thumbnails.medium.url;
                const channel = video.snippet.channelTitle;

                const card = `
                    <div class="video-card" onclick="playVideo('${videoId}')" style="cursor:pointer;">
                        <img src="${thumb}" style="width:100%; border-radius:10px;">
                        <h4 style="font-size:14px; margin:10px 0;">${title}</h4>
                        <p style="color:#aaa; font-size:12px;">${channel}</p>
                    </div>
                `;
                videoContainer.innerHTML += card;
            });
        }

        function playVideo(id) {
            window.location.href = `https://www.youtube.com/watch?v=${id}`;
        }

        // पेज खुलते ही इंडिया लोड होगा
        window.onload = () => loadPrimeTube('IN');
    </script>

</body>
</html>
