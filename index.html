<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPlay Pro</title>
    <style>
        /* - Deep Dark Theme */
        body {
            background-color: #0f0f14;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding-bottom: 80px;
        }

        .container { padding: 16px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .greeting { font-size: 14px; color: #aaa; margin: 0; }
        .brand { font-size: 26px; font-weight: 800; margin: 5px 0; }

        /* - Search Box with Mic */
        .search-container {
            background: #1e1e2a;
            border-radius: 25px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            border: 1px solid #2a2a3a;
            margin-bottom: 20px;
        }
        .search-container input {
            background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 15px;
        }

        /* Category Tabs */
        .tabs { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; margin-bottom: 25px; scrollbar-width: none; }
        .tab { padding: 10px 22px; border-radius: 20px; background: #1e1e2a; font-size: 14px; cursor: pointer; }
        .tab.active { background: #ff4757; color: white; font-weight: 600; }

        /* - Video Cards */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; }
        .card {
            background: #1e1e2a;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .thumbnail {
            width: 100%; height: 200px; object-fit: cover;
            background: linear-gradient(135deg, #2a2a40, #161625);
        }
        .duration {
            position: absolute; bottom: 80px; right: 15px; background: rgba(0,0,0,0.8);
            padding: 2px 6px; border-radius: 4px; font-size: 12px;
        }
        .card-info { padding: 15px; display: flex; gap: 12px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: #444; }
        .title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .meta { font-size: 12px; color: #888; }

        /* - Floating Blur Nav bar */
        .bottom-nav {
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: rgba(30, 30, 42, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            display: flex; justify-content: space-around;
            padding: 12px; border: 1px solid rgba(255,255,255,0.1);
        }
        .nav-btn { text-align: center; font-size: 11px; color: #666; cursor: pointer; }
        .nav-btn.active { color: #ff4757; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <p class="greeting">Good Evening 👋</p>
            <h1 class="brand">StreamPlay</h1>
        </div>
        <div style="background:#1e1e2a; width:45px; height:45px; border-radius:50%; border:2px solid #ff4757;"></div>
    </div>

    <div class="search-container">
        <span style="margin-right:10px; color:#666;">🔍</span>
        <input type="text" id="searchInput" placeholder="Search videos, creators...">
        <span style="color:#666; margin-left:10px;">🎤</span>
    </div>

    <div class="tabs">
        <div class="tab active">All</div>
        <div class="tab">Trending</div>
        <div class="tab">Gaming</div>
        <div class="tab">Music</div>
        <div class="tab">Movies</div>
    </div>

    <h2 class="section-title">Featured Today</h2>

    <div id="videoGrid">
        <div class="card">
            <div class="thumbnail" style="background: url('https://picsum.photos/400/220?random=1') center/cover;"></div>
            <div class="duration">18:42</div>
            <div class="card-info">
                <div class="avatar"></div>
                <div>
                    <div class="title">Building the Future with AI</div>
                    <div class="meta">Nova Tech • 1.2M views</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-btn active">🏠<br>Home</div>
    <div class="nav-btn">📈<br>Trending</div>
    <div class="nav-btn">👤<br>Profile</div>
</div>

<script>
    // - Search Box Logic
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            alert('Searching for: ' + this.value + '\nAPI is ready to connect!');
        }
    });
</script>

</body>
</html>
