<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrimeTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f0f0f; --red: #ff0000; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; font-family: sans-serif; overflow-x: hidden; }
        
        header { position: fixed; top: 0; width: 100%; height: 50px; background: var(--bg); display: flex; align-items: center; padding: 0 10px; z-index: 1000; border-bottom: 0.1px solid #333; }
        .logo { color: white; font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 5px; }
        .search-bar { background: #121212; border: 1px solid #333; border-radius: 20px; flex: 1; margin: 0 10px; padding: 5px 15px; display: flex; }
        .search-bar input { background: none; border: none; color: white; width: 100%; outline: none; }    </style></head>
<body>
    <header>
        <div class="logo"><i class="fab fa-youtube" style="color:red"></i> PrimeTube</div>
        <div class="search-bar"><input type="text" id="searchInput" placeholder="Search..." onkeyup="if(event.key==='Enter') fetchVideos()"></div>
    </header><!-- यह कोड <header> के ठीक नीचे और <div class="feed"> के ऊपर डालें -->
<div class="filter-bar" style="display: flex; gap: 10px; padding: 10px; overflow-x: auto; background: #0f0f0f; position: sticky; top: 50px; z-index: 999; scrollbar-width: none;">
    <button onclick="fetchVideos('All')" style="background: #fff; color: #000; border: none; padding: 6px 15px; border-radius: 8px; font-weight: bold;">All</button>
    <button onclick="fetchVideos('Music')" style="background: #272727; color: white; border: none; padding: 6px 15px; border-radius: 8px;">Music</button>
    <button onclick="fetchVideos('Mixes')" style="background: #272727; color: white; border: none; padding: 6px 15px; border-radius: 8px;">Mixes</button>
    <button onclick="fetchVideos('Bhojpuri')" style="background: #272727; color: white; border: none; padding: 6px 15px; border-radius: 8px;">Bhojpuri</button>
    <button onclick="fetchVideos('Live')" style="background: #272727; color: white; border: none; padding: 6px 15px; border-radius: 8px;">Live</button>
</div><script>
    // YouTube API Key - यहाँ आप अपनी की (Key) लगा सकते हैं
    const API_KEY = 'AIzaSyBpeELAxOw_KMG8E6b7HlLG2F2_Clj1O3g'; 

    async function fetchVideos(query = 'Music') {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${query}&type=video&key=${API_KEY}`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            const feed = document.getElementById('videoFeed');
            feed.innerHTML = '';
            data.items.forEach(item => {
                feed.innerHTML += `
                    <div class="video-card">
                        <div class="thumbnail" onclick="playVideo('${item.id.videoId}')">
                            <img src="${item.snippet.thumbnails.high.url}">
                        </div>
                        <div class="video-info">
                            <div class="channel-pfp"></div>
                            <div class="text-info">
                                <div class="v-title">${item.snippet.title}</div>
                                <div class="v-meta">${item.snippet.channelTitle}</div>
                            </div>
                        </div>
                    </div>`;
            });
        } catch (e) { alert("वीडियो लोड करने में समस्या आई!"); }
    }

    function playVideo(id) {
        const overlay = document.getElementById('player-overlay');
        overlay.style.display = 'block';
        document.getElementById('videoFrame').innerHTML = 
            `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" style="width:100%; height:100%;"></iframe>`;
    }

    function stopVideo() {
        document.getElementById('player-overlay').style.display = 'none';
        document.getElementById('videoFrame').innerHTML = '';
    }

    // ऑटो-लोड
    window.onload = () => fetchVideos();
</script>
