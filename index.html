<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Tube Vanced Pro</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: 'Roboto', sans-serif; overflow-x: hidden; }
        
        /* Premium Header: Search then Bell */
        .vanced-header {
            position: fixed; top: 0; width: 100%; height: 60px; background: #000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; z-index: 5000; border-bottom: 0.1px solid #333;
        }
        .search-container { 
            background: #121212; border-radius: 20px; padding: 6px 12px; 
            display: flex; align-items: center; flex: 0.8; border: 1px solid #333; margin-right: 10px;
        }
        .search-container input { background: transparent; border: none; color: #fff; width: 100%; outline: none; }

        /* Black Categories */
        .category-tray {
            display: flex; gap: 10px; padding: 75px 12px 15px;
            overflow-x: auto; scrollbar-width: none; background: #000;
        }
        .chip {
            background: #272727; padding: 8px 16px; border-radius: 10px;
            font-size: 13px; white-space: nowrap; border: 1px solid #444;
        }

        /* Video Feed with Player Buttons */
        .video-feed { padding-bottom: 80px; }
        .v-card { margin-bottom: 25px; border-bottom: 1px solid #111; }
        .v-card iframe { width: 100%; aspect-ratio: 16/9; border: none; background: #111; }
        
        .player-btns { display: flex; justify-content: center; gap: 40px; padding: 10px; background: #000; }
        .ctrl-btn { font-size: 30px; color: #3ea6ff; cursor: pointer; }

        /* Bottom Menu */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 55px;
            background: #000; display: flex; justify-content: space-around;
            align-items: center; border-top: 0.5px solid #222; z-index: 5000;
        }
    </style>
</head>
<body>

    <div class="vanced-header">
        <div style="display: flex; align-items: center; gap: 5px;">
            <i class="material-icons" style="color:red; font-size:30px;">play_circle_filled</i>
            <span style="font-weight: bold;">Prime Tube</span>
        </div>
        <div class="search-container">
            <i class="material-icons" style="font-size:18px; color:#aaa;">search</i>
            <input type="text" placeholder="Search Global Music...">
        </div>
        <i class="material-icons" style="font-size:24px;">notifications_none</i>
    </div>

    <div class="category-tray">
        <div class="chip">Trending</div>
        <div class="chip">Bhojpuri Hits</div>
        <div class="chip">Hollywood</div>
        <div class="chip">Punjabi Pop</div>
        <div class="chip">South Special</div>
    </div>

    <div class="video-feed" id="feed">
        <div class="v-card">
            <iframe src="https://www.youtube.com/embed/videoseries?list=PLw-VjHDlE-8j3f5p7B-x20A6Yp9XvC_D7"></iframe>
            <div class="player-btns">
                <i class="material-icons ctrl-btn">skip_previous</i>
                <i class="material-icons ctrl-btn" style="font-size:45px;">play_arrow</i>
                <i class="material-icons ctrl-btn">skip_next</i>
            </div>
            <div style="padding: 10px; font-weight: bold;">Global Non-Stop Hits 2026</div>
        </div>
    </div>

    <div class="bottom-nav">
        <i class="material-icons">home</i>
        <i class="material-icons">bolt</i>
        <i class="material-icons" style="font-size:45px;">add_circle_outline</i>
        <i class="material-icons">subscriptions</i>
        <i class="material-icons">video_library</i>
    </div>

</body>
</html>
