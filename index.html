<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeTube Pro</title>
    <style>
        body { background: #0f0f0f; color: white; font-family: sans-serif; margin: 0; }
        #videoFeed { display: grid; grid-template-columns: 1fr; gap: 15px; padding: 10px; margin-top: 20px; }
        .video-card { cursor: pointer; background: #1a1a1a; border-radius: 10px; overflow: hidden; }
        .video-card img { width: 100%; aspect-ratio: 16/9; }
        .info { padding: 10px; }
        /* प्लेयर का जादू */
        #player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; }
    </style>
</head>
<body>

    <div id="videoFeed">Loading...</div>

    <!-- प्लेयर -->
    <div id="player-overlay" onclick="this.style.display='none'; document.getElementById('frame').innerHTML=''">
        <div id="frame" style="width:100%; height:300px; margin-top:50px;"></div>
        <p style="text-align:center;">बंद करने के लिए कहीं भी छुएं</p>
    </div>

    <script>
        const MY_KEY = 'AIzaSyC4bqY4H-B8f4fejeAHUg8X5TFvLpZjQmY';

        async function loadTrending() {
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=Trending&type=video&key=${MY_KEY}`;
            const res = await fetch(url);
            const data = await res.json();
            
            let html = '';
            data.items.forEach(item => {
                html += `
                    <div class="video-card" onclick="play('${item.id.videoId}')">
                        <img src="${item.snippet.thumbnails.high.url}">
                        <div class="info"><h3>${item.snippet.title}</h3></div>
                    </div>`;
            });
            document.getElementById('videoFeed').innerHTML = html;
        }

        function play(id) {
            document.getElementById('player-overlay').style.display = 'block';
            document.getElementById('frame').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
        }

        loadTrending(); // पेज खुलते ही फंक्शन चलेगा
    </script>
</body>
</html>
