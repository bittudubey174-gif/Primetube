<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrimeTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f0f0f; --red: #ff0000; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: white; font-family: sans-serif; overflow-x: hidden; }
        
        header { position: fixed; top: 0; width: 100%; height: 50px; background: var(--bg); display: flex; align-items: center; padding: 0 10px; z-index: 1000; border-bottom: 0.1px solid #333; }
        .logo { color: white; font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 5px; }
        .search-bar { background: #121212; border: 1px solid #333; border-radius: 20px; flex: 1; margin: 0 10px; padding: 5px 15px; display: flex; }
        .search-bar input { background: none; border: none; color: white; width: 100%; outline: none; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><i class="fab fa-youtube" style="color:red"></i> PrimeTube</div>
        <div class="search-bar"><input type="text" id="searchInput" placeholder="Search..." onkeyup="if(event.key==='Enter') fetchVideos()"></div>
    </header>
    <!-- हिस्सा 2: Video List & Mini Player Styling -->
    <style>
        /* वीडियो फीड का स्टाइल */
        .feed { margin-top: 55px; padding-bottom: 70px; }
        .video-card { width: 100%; margin-bottom: 15px; background: #000; }
        .thumbnail { width: 100%; aspect-ratio: 16/9; background: #222; position: relative; cursor: pointer; }
        .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        
        /* वीडियो के नीचे की जानकारी */
        .video-info { display: flex; padding: 12px; gap: 12px; position: relative; align-items: flex-start; }
        .channel-pfp { width: 36px; height: 36px; border-radius: 50%; background: #444; flex-shrink: 0; }
        .text-info { flex: 1; cursor: pointer; }
        .v-title { font-size: 14px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #fff; }
        .v-meta { font-size: 12px; color: #aaa; margin-top: 4px; }
        
        /* शेयर बटन का स्टाइल */
        .share-btn { color: #fff; padding: 8px; position: absolute; right: 5px; top: 10px; cursor: pointer; opacity: 0.8; }

        /* मिनी प्लेयर (Fixing the Layout "Phatna" Issue) */
        #player-overlay { position: fixed; bottom: 65px; right: 10px; width: 180px; height: 100px; background: #000; border-radius: 8px; overflow: hidden; display: none; box-shadow: 0 0 15px rgba(0,0,0,0.8); z-index: 9999; border: 1px solid #444; }
        #player-overlay iframe { width: 100%; height: 100%; border: none; }
        .close-player { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: white; width: 22px; height: 22px; border-radius: 50%; text-align: center; line-height: 22px; font-size: 14px; z-index: 10000; cursor: pointer; font-weight: bold; }
    </style>

    <!-- HTML Elements for Video Display -->
    <div id="player-overlay">
        <div class="close-player" onclick="stopVideo()">×</div>
        <div id="videoFrame"></div>
    </div>

    <div class="feed" id="videoFeed">
        <!-- यहाँ वीडियो लोड होंगे -->
    </div>
