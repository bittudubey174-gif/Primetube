<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeTube - Aryan Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f0f0f; color: white; font-family: sans-serif; margin: 0; }
        
        /* Header & Search Bar */
        header { 
            position: fixed; top: 0; width: 100%; height: 60px; 
            background: #0f0f0f; display: flex; align-items: center; 
            padding: 0 15px; z-index: 1000; border-bottom: 1px solid #333;
        }
        .logo { font-size: 20px; font-weight: bold; color: white; display: flex; align-items: center; gap: 5px; }
        .logo i { color: red; }
        
        .search-container { flex: 1; margin: 0 15px; display: flex; }
        .search-container input { 
            width: 100%; background: #121212; border: 1px solid #333; 
            color: white; padding: 8px 15px; border-radius: 20px 0 0 20px; outline: none;
        }
        .search-btn { 
            background: #222; border: 1px solid #333; color: white; 
            padding: 8px 15px; border-radius: 0 20px 20px 0; cursor: pointer;
        }

        /* Video Feed Area */
        #videoFeed { margin-top: 80px; padding: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fab fa-youtube"></i> PrimeTube</div>
        <div class="search-container">
            <input type="text" id="userInput" placeholder="यहाँ सर्च करें...">
            <button class="search-btn" onclick="searchNow()"><i class="fas fa-search"></i></button>
        </div>
    </header>

    <div id="videoFeed">
        <!-- यहाँ वीडियो दिखाई देंगे -->
    </div>

    <script>
        // आपकी अपनी Key यहाँ सेट कर दी गई है
        const MY_KEY = 'async function searchNow() {
    const query = document.getElementById('userInput').value;
    if(!query) return;

    // यहाँ आपकी Key है
    const MY_KEY = 'AIzaSyBpeELAxOw_KMG8E6b7HlLG2F2_Clj1O3g';
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${query}&type=video&key=${MY_KEY}`;
    
    try {
        const response = await fetch(url);
        const data = await response.json();

        // अगर API में गड़बड़ है तो alert के बजाय कंसोल में दिखेगा
        if(data.error) {
            console.log("API Error:", data.error.message);
            document.getElementById('videoFeed').innerHTML = `<p style="color:red; text-align:center;">भाई, अभी API Key एक्टिव नहीं हुई है। 10 मिनट बाद ट्राई करें या Google Console में जाकर 'YouTube Data API v3' इनेबल करें।</p>`;
            return;
        }

        displayResults(data.items);
    } catch (error) {
        console.log("Network Error");
    }
        }
