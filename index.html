<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPlay - Dark Edition</title>
    <style>
        /* - Dark Background & Typography */
        body {
            background-color: #12121a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Header Section */
        .header {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-greeting {
            font-size: 14px;
            color: #888;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* - Pro Search Box */
        .search-bar {
            background: #1e1e26;
            border-radius: 30px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            border: 1px solid #2a2a35;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 16px;
        }

        /* Category Chips */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 20px;
            scrollbar-width: none;
        }

        .chip {
            background: #23232e;
            padding: 8px 20px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 14px;
            cursor: pointer;
        }

        .chip.active {
            background: #e91e63; /* Image jaisa Pink/Red shade */
        }

        /* - Featured Card Section */
        .section-title {
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .card-container {
            display: flex;
            gap: 15px;
            padding: 0 20px;
            overflow-x: auto;
        }

        .video-card {
            min-width: 200px;
            background: #1e1e26;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .thumbnail {
            width: 100%;
            height: 120px;
            background: linear-gradient(45deg, #3a1c71, #d76d77);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(233, 30, 99, 0.9);
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 10px;
            text-transform: uppercase;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(18, 18, 26, 0.95);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #2a2a35;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            text-align: center;
            font-size: 12px;
            color: #666;
        }

        .nav-item.active {
            color: #e91e63;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-greeting">Good Evening 👋</div>
        <div class="logo">StreamPlay</div>
        <div class="search-bar">
            <input type="text" placeholder="Search videos, creators...">
            <span>🔍</span>
        </div>
    </div>

    <div class="categories">
        <div class="chip active">All</div>
        <div class="chip">Trending</div>
        <div class="chip">Gaming</div>
        <div class="chip">Music</div>
        <div class="chip">Tech</div>
    </div>

    <div class="section-title">Featured Today</div>
    
    <div class="card-container">
        <div class="video-card">
            <div class="badge">Trending</div>
            <div class="thumbnail">Building the Future</div>
            <div style="padding:10px;">
                <div style="font-size:14px; font-weight:500;">Building the Future with AI</div>
                <div style="font-size:12px; color:#888;">Nova Tech • 18:42</div>
            </div>
        </div>

        <div class="video-card">
            <div class="thumbnail" style="background: linear-gradient(45deg, #ff9966, #ff5e62);">Food Tour</div>
            <div style="padding:10px;">
                <div style="font-size:14px; font-weight:500;">Street Food Tour: Tokyo</div>
                <div style="font-size:12px; color:#888;">Maya Travels • 24:15</div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">🏠<br>Home</div>
        <div class="nav-item">📈<br>Trending</div>
        <div class="nav-item">👤<br>Profile</div>
    </div>

</body>
</html>
